name: Deploy to Core-Prod Harbor

on:
  push:
     tags:        
      - '*'   

jobs:
  build:
    
    name: Build Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code and submodule
      uses: actions/checkout@v4
      with:
          submodules: 'true'
          token: ${{ secrets.TOKEN }}
        
    - name: Login to Harbor Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ vars.HARBOR_REGISTRY || secrets.HARBOR_REGISTRY }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: Build, tag, and push image to Harbor Container Registry
      env:
        REGISTRY: ${{ vars.HARBOR_REGISTRY || secrets.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT || secrets.HARBOR_PROJECT }}
        IMAGE_TAG: ${{ github.ref_name }}
        REPOSITORY: python-api-skeleton
      run: |
        docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
        docker build -t "$REGISTRY/$REPOSITORY:latest" .
        docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
        docker push "$REGISTRY/$REPOSITORY:latest"
        echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    uses: OptiMargin-Software/k8s-optimargin/.github/workflows/automated_pr.yaml@main
    with:
      repository: ${{ github.repository }}
      repository_owner: ${{ github.repository_owner }}
      new_tag: ${{ github.ref_name }}
      image: ""
    secrets: inherit
